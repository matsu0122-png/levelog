services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-levelog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-levelog}
      POSTGRES_DB: ${POSTGRES_DB:-levelog}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - levelog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-levelog}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-postgres://levelog:levelog@db:5432/levelog?sslmode=disable}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  levelog_db_data:
