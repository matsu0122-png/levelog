# Shared between the plain-HTTP and HTTPS server blocks in nginx.conf via
# `include` — kept in one place so the two never drift apart.

root /usr/share/nginx/html;
index index.html;

server_tokens off;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# The whole built app (index.html) loads no script/style/font/image/connect
# target other than itself — confirmed by inspecting dist/index.html (no
# inline script/style tags; Vite emits only external, same-origin
# /assets/*) and frontend/src (no fetch/XHR/import of any external origin;
# same-origin /api/ only, per the proxy below). default-src alone covers
# every fetch directive (connect-src, script-src, style-src, etc.) that
# isn't set separately. If VITE_API_BASE_URL is ever pointed at a
# cross-origin API (docker-compose.prod.yml documents this as an opt-in,
# non-default configuration), this policy needs a matching connect-src
# added, or requests to that origin will be blocked.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
# Safe to send unconditionally even though this file is shared with the
# plain-HTTP server block (nginx.conf): browsers are required to ignore
# Strict-Transport-Security received over a non-HTTPS connection (RFC
# 6797), so it's a no-op there. includeSubDomains/preload deliberately
# left off — matsu0122.com (nginx.conf/docs/tls-design.md) may have other
# subdomains that aren't HTTPS-ready, and preload is effectively
# irreversible once submitted.
add_header Strict-Transport-Security "max-age=63072000" always;

# Hashed filenames (dist/assets/*) are safe to cache forever.
#
# nginx only inherits add_header directives from the parent context when
# the current location defines none of its own — a location with even one
# add_header (Cache-Control below) silently drops every parent-level
# add_header, including the security headers above. So they're repeated
# here rather than relied on to inherit.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    try_files $uri =404;
}

# index.html must always be revalidated so a redeploy's new asset
# hashes are picked up instead of serving a stale cached shell. Also the
# effective target of location /'s try_files fallback (an internal
# redirect re-matches locations), so this is where most HTML responses
# actually land — same add_header-inheritance caveat as /assets/ above.
location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
}

# Same-origin proxy to the backend so the browser only ever talks to
# one origin (avoids cross-site cookie/CORS concerns in production).
location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Served unredirected on both plain HTTP and HTTPS (see nginx.conf) so the
# load balancer's port-80 health check gets a real 200, not a 301.
location /health/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
}

location / {
    try_files $uri $uri/ /index.html;
}
