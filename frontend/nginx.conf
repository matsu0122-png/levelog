# Plain HTTP: redirect everything to HTTPS except /health/, which the
# load balancer's port-80 health check hits directly (see
# terraform/modules/load_balancer) — redirecting it too would turn every
# health check into a 301, not the 200 the load balancer expects.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    location /health/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Nginx's own liveness, independent of the api container — used by
    # this image's HEALTHCHECK. Deliberately distinct from /health/ above:
    # that one reflects the *backend's* health, this one only Nginx's.
    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: TLS is terminated here, at each app server's own Nginx — the
# Sakura Cloud load balancer in front of this (terraform/modules/
# load_balancer) is a plain TCP pass-through with no TLS termination of
# its own, so this is the only place certificates matter. See
# docs/tls-design.md for how cert_file/key_file below get onto the server
# and kept renewed.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/snippets/nginx-locations.conf;
}
